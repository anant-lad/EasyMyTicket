name: Build, Test & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION:     ap-south-1
  AWS_ACCOUNT_ID: 808812816838
  EKS_CLUSTER:    ticketing-prod-cluster

jobs:
  # ── 1. Test (real PostgreSQL service container) ───────────────────────────
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER:     ticketing_admin
          POSTGRES_PASSWORD: test
          POSTGRES_DB:       tickets_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ticketing_admin -d tickets_db"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DB_HOST:       localhost
      DB_PORT:       "5432"
      DB_NAME:       tickets_db
      DB_USER:       ticketing_admin
      DB_PASSWORD:   test
      DB_SSL_MODE:   disable
      REDIS_ENABLED: "false"
      SQS_ENABLED:   "false"
      GROQ_API_KEY:  test_key
      API_KEYS:      ci-test-key-00000000000000000000000000000000000000000000000000
      ENVIRONMENT:   test
      LOG_LEVEL:     WARNING

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest httpx

      - name: Apply DB schema
        run: |
          psql postgresql://ticketing_admin:test@localhost:5432/tickets_db \
            -f src/database/create_tables_v2.sql
          psql postgresql://ticketing_admin:test@localhost:5432/tickets_db \
            -f scripts/db_schema_v3_patch.sql

      - name: Run tests
        run: pytest tests/ -v --tb=short -x

  # ── 2. Build & push API image ─────────────────────────────────────────────
  build-api:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify AWS secrets are set
        run: |
          if [ -z "$KEY_ID" ]; then
            echo "ERROR: AWS_ACCESS_KEY_ID secret is empty or not set"
            echo "Go to Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi
          echo "AWS_ACCESS_KEY_ID is set (starts with ${KEY_ID:0:4}...)"
        env:
          KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push ticketing-api
        id: build
        run: |
          IMAGE="${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/ticketing-api:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          docker tag "$IMAGE" \
            "${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/ticketing-api:latest"
          docker push \
            "${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/ticketing-api:latest"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

  # ── 3. Build & push worker image ─────────────────────────────────────────
  build-worker:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push ticket-worker
        run: |
          IMAGE="${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/ticket-worker:${{ github.sha }}"
          docker build -t "$IMAGE" --build-arg WORKER=true .
          docker push "$IMAGE"
          docker tag "$IMAGE" \
            "${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/ticket-worker:latest"
          docker push \
            "${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/ticket-worker:latest"

  # ── 4. Deploy to EKS ─────────────────────────────────────────────────────
  deploy:
    needs: [build-api, build-worker]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.EKS_CLUSTER }}

      - name: Apply K8s manifests (namespace, configmap, serviceaccount)
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/serviceaccount.yaml

      - name: Sync ticketing-secrets from GitHub secrets
        run: |
          kubectl create secret generic ticketing-secrets \
            -n ticketing \
            --from-literal=DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            --from-literal=GROQ_API_KEY="${{ secrets.GROQ_API_KEY }}" \
            --from-literal=API_KEYS="${{ secrets.API_KEYS }}" \
            --from-literal=SUPPORT_EMAIL="${{ secrets.SUPPORT_EMAIL }}" \
            --from-literal=SUPPORT_EMAIL_APP_PASSWORD="${{ secrets.SUPPORT_EMAIL_APP_PASSWORD }}" \
            --from-literal=REDIS_AUTH="${{ secrets.REDIS_AUTH }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply API deployment manifest (server-side, removes any manual patches)
        run: |
          # Stamp the exact SHA image into the manifest before applying so that
          # kubectl apply + kubectl set image are one single rollout, not two.
          IMAGE="${{ needs.build-api.outputs.image }}"
          sed "s|808812816838.dkr.ecr.ap-south-1.amazonaws.com/ticketing-api:latest|${IMAGE}|g" \
            k8s/api-deployment.yaml | kubectl apply -f - --server-side --force-conflicts

      - name: Clear stuck terminating pods
        run: |
          echo "=== Current pod state ==="
          kubectl get pods -n ticketing || true
          echo "=== Force-deleting any stuck Terminating pods ==="
          kubectl get pods -n ticketing --no-headers \
            | awk '/Terminating/{print $1}' \
            | xargs -r -I{} kubectl delete pod {} -n ticketing --grace-period=0 --force 2>/dev/null || true
          kubectl delete pods -n ticketing --field-selector=status.phase=Failed --grace-period=0 --force 2>/dev/null || true
          echo "=== Pod state after cleanup ==="
          kubectl get pods -n ticketing || true

      - name: Roll out new API image
        run: |
          # kubectl apply already stamped the SHA image above, so set image here
          # is a no-op for the image (it may trigger rollout if apply didn't).
          kubectl set image deployment/ticketing-api \
            ticketing-api=${{ needs.build-api.outputs.image }} \
            -n ticketing
          kubectl rollout status deployment/ticketing-api -n ticketing --timeout=12m || {
            echo "=== ROLLOUT FAILED — diagnostics ==="
            kubectl get pods -n ticketing -o wide
            echo "--- Pod events ---"
            kubectl get events -n ticketing --sort-by=.lastTimestamp | tail -30
            echo "--- New pod logs (last 50 lines) ---"
            kubectl get pods -n ticketing -l app=ticketing-api --no-headers \
              | awk '{print $1}' \
              | head -1 \
              | xargs -I{} kubectl logs {} -n ticketing --tail=50 2>/dev/null || true
            echo "--- Pod describe ---"
            kubectl get pods -n ticketing -l app=ticketing-api --no-headers \
              | awk '{print $1}' \
              | head -1 \
              | xargs -I{} kubectl describe pod {} -n ticketing 2>/dev/null || true
            exit 1
          }

      - name: Roll out new worker image
        run: |
          WORKER_IMAGE="${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/ticket-worker:${{ github.sha }}"
          kubectl set image deployment/ticket-worker \
            ticket-worker="$WORKER_IMAGE" \
            -n ticketing
          kubectl rollout status deployment/ticket-worker -n ticketing --timeout=8m

      - name: Verify deployment
        run: |
          kubectl get pods -n ticketing
          kubectl get ingress -n ticketing
