apiVersion: batch/v1
kind: Job
metadata:
  name: seed-technicians
  namespace: ticketing
  labels:
    app: seed-technicians
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 1
  template:
    spec:
      serviceAccountName: ticketing-sa
      restartPolicy: Never
      containers:
        - name: seed
          image: python:3.11-slim
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              pip install --quiet psycopg2-binary boto3
              python - <<'PYEOF'
              import boto3, os

              s3 = boto3.client("s3", region_name=os.environ["AWS_REGION"])
              print("Downloading seed script from S3...")
              s3.download_file(
                  os.environ["S3_BUCKET"],
                  "build/seed_technicians.py",
                  "/tmp/seed_technicians.py"
              )
              PYEOF
              echo "Running seed script..."
              python /tmp/seed_technicians.py
          env:
            - name: DB_HOST
              value: "ticketing-prod-postgres.cjq0y6uyg5xd.ap-south-1.rds.amazonaws.com"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "tickets_db"
            - name: DB_USER
              value: "ticketing_admin"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ticketing-secrets
                  key: DB_PASSWORD
            - name: S3_BUCKET
              value: "ticketing-prod-datasets-808812816838"
            - name: AWS_REGION
              value: "ap-south-1"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
