apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticketing-api
  namespace: ticketing
  labels:
    app: ticketing-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ticketing-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ticketing-api
    spec:
      serviceAccountName: ticketing-sa
      nodeSelector:
        role: api
      terminationGracePeriodSeconds: 30
      containers:
        - name: ticketing-api
          # Replace with actual ECR URL from: terraform output ecr_api_url
          image: 808812816838.dkr.ecr.ap-south-1.amazonaws.com/ticketing-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: ticketing-config
            - secretRef:
                name: ticketing-secrets
          resources:
            requests:
              cpu: 256m
              memory: 1Gi
            limits:
              cpu: 1000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
